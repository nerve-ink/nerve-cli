name: Docker Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish nerve-cli image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve Docker image
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              echo "::error title=Missing Docker Hub credentials::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in nerve-ink/nerve-cli before publishing ${REF_NAME}."
              exit 1
            fi
            echo "::notice title=Docker Hub skipped::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in nerve-ink/nerve-cli to publish main images."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME}/nerve-cli}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: ${{ steps.image.outputs.enabled == 'true' }}

      - uses: docker/login-action@v3
        if: ${{ steps.image.outputs.enabled == 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        if: ${{ steps.image.outputs.enabled == 'true' }}
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        if: ${{ steps.image.outputs.enabled == 'true' }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
